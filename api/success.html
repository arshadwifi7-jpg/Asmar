<!DOCTYPE html>
<html>
<head>
  <title>Success</title>
  <style>
    body { background: #0a0a0a; color: #fff; text-align: center; padding: 50px; }
    .box { background: #1a1a1a; border: 2px solid #00ff88; border-radius: 20px; padding: 40px; max-width: 500px; margin: 0 auto; }
    h1 { color: #00ff88; }
    .code { font-size: 2rem; color: #d4af37; margin: 20px 0; letter-spacing: 5px; }
    a { display: inline-block; background: #d4af37; color: #000; padding: 15px 30px; border-radius: 30px; text-decoration: none; margin-top: 20px; }
  </style>
</head>
<body>
  <div class="box">
    <h1>✓ Success!</h1>
    <div class="code" id="code">LOADING...</div>
    <a href="#" id="link">Connect WiFi</a>
  </div>
  <script>
    const voucher = 'ASMAR-' + Math.random().toString(36).substr(2,6).toUpperCase();
    document.getElementById('code').textContent = voucher;
    document.getElementById('link').href = 'http://192.168.88.1/login?username=' + voucher + '&password=' + voucher;
  </script>
</body>
</html>
